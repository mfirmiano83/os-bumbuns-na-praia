<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bumbuns dev</title>
<style>html,body{margin:0;height:100%;background:#06121c;color:#eee;font-family:system-ui;overflow:hidden}#c{position:fixed;inset:0;width:100vw;height:100vh}#s{position:fixed;left:8px;top:8px;z-index:3}</style></head>
<body><canvas id="c" tabindex="-1"></canvas><div id="s">diagnostico…</div>
<script>
const qs = new URLSearchParams(location.search);
if (qs.get("gl") === "1") { try { Object.defineProperty(navigator, "gpu", { value: undefined, configurable: true }); } catch (e) {} }
const s = document.getElementById("s");
async function gz(url, type) {
  const r = await fetch(url); const ds = r.body.pipeThrough(new DecompressionStream("gzip"));
  const b = await new Response(ds).blob(); return URL.createObjectURL(new Blob([b], { type }));
}
(async () => {
  s.textContent = "baixando…";
  const [data, wasm] = await Promise.all([gz("WebDev.data.gz", "application/octet-stream"), gz("WebDev.wasm.gz", "application/wasm")]);
  s.textContent = "iniciando…";
  const sc = document.createElement("script"); sc.src = "WebDev.loader.js";
  sc.onload = () => createUnityInstance(document.getElementById("c"), {
    dataUrl: data, frameworkUrl: "WebDev.framework.js", codeUrl: wasm, streamingAssetsUrl: "../StreamingAssets",
    companyName: "Bumbuns", productName: "Os Bumbuns na Praia", productVersion: "dev", devicePixelRatio: 1, cacheControl: () => "no-store"
  }).then(i => { window.unity = i; s.textContent = ""; }).catch(e => s.textContent = "erro: " + e);
  document.body.appendChild(sc);
})();
</script></body></html>
